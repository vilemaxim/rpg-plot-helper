# Which LLM each kind of Interview uses (ADR-0008). Read and checked when the
# app starts; a key it does not know stops it. Set INTERVIEWS_CONFIG to use
# another file.
#
# A kind of Interview is on only if it has an entry here and its provider's
# key is set in the environment variable named by `key_env`. Otherwise it is
# off, and Mods are pasted or uploaded as before.

[providers.anthropic]
key_env = "ANTHROPIC_API_KEY"

# Any endpoint that speaks OpenAI's Chat Completions API (OpenAI, OpenRouter,
# Gemini's compatibility endpoint, a local model) is a provider of kind
# "openai-compatible", under a name of your choosing. `base_url` is required;
# `key_env` may be left out for a local endpoint that needs no key. To use it,
# set `provider = "openrouter"` below; `effort` is then sent as the endpoint's
# `reasoning_effort`.
#
# [providers.openrouter]
# kind = "openai-compatible"
# base_url = "https://openrouter.ai/api/v1"
# key_env = "OPENROUTER_API_KEY"

# Writing a new Mod. `effort` is the provider's own: for Anthropic one of
# low, medium, high, xhigh or max.
[interviews.new-mod]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
# When the LLM writes a Mod file with errors, the app sends it the errors to
# fix, up to this many times, before showing the person the file and its
# errors. 0 shows them at once.
max_fix_attempts = 3

# Revising a draft a Plot Master sent back: the Interview starts from the
# draft, why it was sent back and its open Flags. On or off on its own: leave
# it out and drafts are revised by pasting or uploading a file, as before.
[interviews.revise-mod]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
# As for a new Mod: how many times the LLM is sent its revision's errors.
max_fix_attempts = 3

# Writing an After-Action Report: the Mod Runner walks the Path the Stretch
# took through the Mod's Dry Run, with no LLM, then the LLM asks the rest and
# writes the report. On or off on its own: leave it out and reports are
# pasted or uploaded, as before.
[interviews.report]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
# As for a Mod: how many times the LLM is sent its report's errors.
max_fix_attempts = 3

# Reconciliation: the LLM checks a draft Mod against the World's Canon and
# the other drafts, and writes a report for the plot team. It is one report,
# not an Interview, so it has no fix attempts. Leave it out and there is no
# Reconcile button. Its tokens count toward the Organization's monthly cap.
[reconciliation]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000

# World review: the LLM looks across a whole World for drift, dormant Plots
# and chances to bring NPCs and Plots back, and writes a report for the plot
# team. It is given the whole World, so `context_tokens` says how many tokens
# the model can read (raise it for a model that reads more): a World too
# large for it is refused, not cut short.
# Leave it out and there is no World review. Its tokens count toward the
# Organization's monthly cap.
[world-review]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
context_tokens = 200000

# What Interviews may spend, since the deployment pays for every Organization
# on it. Either may be left out, for no limit. Days and months are UTC.
# [limits]
# turns_per_person_per_day = 40
# tokens_per_organization_per_month = 5000000
