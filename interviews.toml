# Which LLM each kind of Interview uses (ADR-0008). Read and checked when the
# app starts; a key it does not know stops it. Set INTERVIEWS_CONFIG to use
# another file.
#
# A kind of Interview is on only if it has an entry here and its provider's
# key is set in the environment variable named by `key_env`. Otherwise it is
# off, and Mods are pasted or uploaded as before.

[providers.anthropic]
key_env = "ANTHROPIC_API_KEY"

# Any endpoint that speaks OpenAI's Chat Completions API (OpenAI, OpenRouter,
# Gemini's compatibility endpoint, a local model) is a provider of kind
# "openai-compatible", under a name of your choosing. `base_url` is required;
# `key_env` may be left out for a local endpoint that needs no key. To use it,
# set `provider = "openrouter"` below; `effort` is then sent as the endpoint's
# `reasoning_effort`.
#
# [providers.openrouter]
# kind = "openai-compatible"
# base_url = "https://openrouter.ai/api/v1"
# key_env = "OPENROUTER_API_KEY"

# Writing a new Mod. `effort` is the provider's own: for Anthropic one of
# low, medium, high, xhigh or max.
[interviews.new-mod]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
# When the LLM writes a Mod file with errors, the app sends it the errors to
# fix, up to this many times, before showing the person the file and its
# errors. 0 shows them at once.
max_fix_attempts = 3

# Revising a draft a Plot Master sent back: the Interview starts from the
# draft, why it was sent back and its open Flags. On or off on its own: leave
# it out and drafts are revised by pasting or uploading a file, as before.
[interviews.revise-mod]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000

# What Interviews may spend, since the deployment pays for every Organization
# on it. Either may be left out, for no limit. Days and months are UTC.
# [limits]
# turns_per_person_per_day = 40
# tokens_per_organization_per_month = 5000000
