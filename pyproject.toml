[project]
name = "rpg-plot-helper"
version = "0.1.0"
description = "Tracks the canon and plots of live-action and tabletop role-playing games."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-sesame>=3.2.5",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "openai>=3.51.0",
    "plotcanon",
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
package = false

[tool.uv.sources]
plotcanon = { git = "https://github.com/vilemaxim/plotcanon", rev = "v0.16.1" }

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
extend-exclude = [".claude"]

[tool.ruff.lint]
# Errors and import order only; the rest of ruff's defaults are not enforced here.
select = ["E4", "E7", "E9", "F", "I"]
