{% if total %}
  <h2>Canon</h2>
  <ul class="kinds">
    {% for address, label, count in kinds %}
      <li><a href="{% url 'canon-list' world.pk address %}">{{ label }}</a> <span class="count">{{ count }}</span></li>
    {% endfor %}
  </ul>
{% else %}
  <p>This World has no Canon yet.</p>
  {% if may_import %}
    <p><a href="{% url 'canon-import' world.pk %}">Import a World from a .zip file</a></p>
  {% endif %}
{% endif %}
